name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The unit tests run against stand-ins for Home Assistant. They need Python 3.12 or
      # later and the package voluptuous.
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install voluptuous
      - run: .venv/bin/python -m unittest discover -s tests
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The static checks of ruff.toml. The version is fixed, because the rule set is the
      # default set of that version. Use the same version for a local run.
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install ruff==0.17.5
      - run: .venv/bin/python -m ruff check .
