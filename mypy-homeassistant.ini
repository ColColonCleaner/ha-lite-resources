# The full type checks, with the types of Home Assistant. mypy reads them from the
# source of Home Assistant core, which the environment variable MYPYPATH names. Nothing
# of that source runs, and no package of Home Assistant is installed.
#
#     git clone --depth 1 --branch 2026.11.2 https://github.com/home-assistant/core
#     MYPYPATH=<path of that clone> mypy --config-file mypy-homeassistant.ini
#
# On Windows, set MYPYPATH with the syntax of the shell. Use the tag of the Home Assistant
# version that runs the integration, and the mypy version that the job "lint" in
# .github/workflows/validate.yaml pins. A library that Home Assistant imports, and that
# the environment lacks, keeps the type Any.

[mypy]
files = custom_components/lite_resources
# Home Assistant 2026.11 runs on Python 3.14, and its source holds syntax of that version.
python_version = 3.14
strict = True
warn_unreachable = True
warn_unused_configs = True

# The source of Home Assistant is read for its types. Its own findings are not those of
# this repository, such as an import of a library that the environment lacks.
[mypy-homeassistant.*]
follow_imports = silent
