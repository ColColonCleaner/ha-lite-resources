# The type checks of this repository that run on each machine, with mypy
# (https://mypy.readthedocs.io/). Run them from the root of the repository:
#
#     mypy
#
# Use the mypy version that the job "lint" in .github/workflows/validate.yaml pins.
#
# These checks read no Home Assistant. Each name from Home Assistant has the type Any,
# also on a machine that holds the package, so the result is the same on each machine.
# They check the calls and the attributes inside the integration, and not its use of
# Home Assistant. mypy-homeassistant.ini holds the full check, which needs the source of
# Home Assistant core.

[mypy]
files = custom_components/lite_resources
# Home Assistant 2026.11 runs on Python 3.14.
python_version = 3.14
strict = True
warn_unreachable = True
warn_unused_configs = True
# Three checks of the strict mode cannot pass when a decorator, a base class and a
# returned value from Home Assistant each have the type Any. So they are off here, and
# on in mypy-homeassistant.ini.
disallow_untyped_decorators = False
disallow_subclassing_any = False
warn_return_any = False

[mypy-homeassistant.*]
follow_imports = skip
ignore_missing_imports = True

# With no type for ConfigFlow, mypy does not know that the class takes the keyword
# "domain".
[mypy-lite_resources.config_flow]
disable_error_code = call-arg
