# The type checks of this repository, with mypy (https://mypy.readthedocs.io/).
# Run them from the root of the repository:
#
#     mypy
#
# Use the mypy version that the job "lint" in .github/workflows/validate.yaml pins.

[mypy]
files = custom_components/lite_resources
strict = True
warn_unreachable = True
warn_unused_configs = True
# The checks run with no Home Assistant installation, as the unit tests do. So mypy reads
# each name from Home Assistant as Any, and it checks the code of the integration itself.
# Three checks of the strict mode cannot pass with such names, so they are off:
# a decorator from Home Assistant, a base class from Home Assistant, and a returned value
# from Home Assistant each have the type Any.
disallow_untyped_decorators = False
disallow_subclassing_any = False
warn_return_any = False

[mypy-homeassistant.*]
ignore_missing_imports = True
